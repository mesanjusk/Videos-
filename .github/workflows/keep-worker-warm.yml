# Pings the worker's /health endpoint so a free-tier host does not spin it down.
#
# Only needed on Render's free plan (see render.yaml). A worker exists to consume queued jobs while
# nobody is watching, which is exactly when a free service is asleep — so a job enqueued at 3am
# waits until something wakes it. This narrows the gap to ten minutes; it does not close it.
#
# Setup: add a WORKER_HEALTH_URL repository secret (Settings → Secrets and variables → Actions)
# pointing at e.g. https://ai-production-os-worker.onrender.com/health, then enable this workflow.
# On a paid plan, disable it — it does nothing useful.

name: Keep worker warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping worker health endpoint
        env:
          WORKER_HEALTH_URL: ${{ secrets.WORKER_HEALTH_URL }}
        run: |
          if [ -z "$WORKER_HEALTH_URL" ]; then
            echo "WORKER_HEALTH_URL is not set — nothing to ping. See the comment at the top of this file."
            exit 0
          fi
          # A cold start can take a while, so allow for it rather than reporting a false failure.
          curl --silent --show-error --fail --max-time 120 "$WORKER_HEALTH_URL" || {
            echo "Worker did not respond. It may be cold-starting; the next run will try again."
            exit 1
          }
